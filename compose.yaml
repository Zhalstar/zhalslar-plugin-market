name: zhalslar-plugin-market

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market}
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}
      SECURE_COOKIES: "true"
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?Set OAUTH_ENCRYPTION_KEY in .env}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITEE_ENABLED: ${GITEE_ENABLED:-false}
      GITEE_CLIENT_ID: ${GITEE_CLIENT_ID:-}
      GITEE_CLIENT_SECRET: ${GITEE_CLIENT_SECRET:-}
      GITEE_CALLBACK_URL: ${GITEE_CALLBACK_URL:-}
    volumes:
      - plugin_assets:/data/assets
      - plugin_packages:/data/packages
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  plugin_assets:
  plugin_packages:
  caddy_data:
  caddy_config:


[project]
name = "zhalslar-plugin-market-backend"
version = "0.1.0"
description = "Self-hosted AstrBot plugin marketplace"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<47",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "packaging>=24,<27",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

